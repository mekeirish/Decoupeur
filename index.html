<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Decoupeur</title>
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-surface: #12161f;
      --bg-elevated: #1a202c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: #00e5ff;
      --accent-cyan: #00e5ff;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.25);
      white-space: nowrap;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .btn-mini {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-mini:active {
      transform: scale(0.96);
    }

    textarea {
      width: 100%;
      height: 180px;
      background: var(--bg-base);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-cyan);
    }
    textarea::-webkit-scrollbar,
    .preview-box::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    textarea::-webkit-scrollbar-track,
    .preview-box::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb,
    .preview-box::-webkit-scrollbar-thumb {
      background: var(--bg-elevated);
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    textarea::-webkit-scrollbar-thumb:hover,
    .preview-box::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .stepper button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    .stepper button:active {
      transform: scale(0.94);
    }

    .stepper input {
      width: 52px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
    }

    .presets {
      display: flex;
      gap: 6px;
    }

    .preset-btn {
      padding: 8px 11px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .preset-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
    }

    .btn-split {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #05070a;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.25);
      transition: transform 0.15s;
    }

    .btn-split:active {
      transform: scale(0.98);
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--bg-base);
      border-radius: 99px;
      overflow: hidden;
      margin-top: -4px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .grid-chunks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 10px;
    }
.chunk-search {
  width: 100%;
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 11px 13px;
  color: var(--text-main);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.chunk-search:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.1);
}
.chunk-search::placeholder {
  color: var(--text-muted);
}
.chunk-btn.search-match {
  border-color: var(--accent-cyan);
  background: rgba(0, 229, 255, 0.14);
  box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.2), 0 0 16px rgba(0, 229, 255, 0.2);
  transform: translateY(-2px);
}
.chunk-btn.search-dimmed {
  opacity: 0.3;
}
    .integrity-panel {
      padding: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .integrity-panel.ok {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .integrity-panel.error {
      border-color: rgba(239, 68, 68, 0.65);
      color: #fca5a5;
    }

    .integrity-title {
      font-weight: 800;
      color: var(--text-main);
    }
    .btn-copy-next {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius-md);
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent-cyan);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-copy-next:hover {
      background: rgba(0, 229, 255, 0.16);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
    }
    .btn-copy-next:active {
      transform: scale(0.98);
    }
    .btn-copy-next.all-done {
      border-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      cursor: default;
    }

    .chunk-btn {
      aspect-ratio: 1 / 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.18s ease;
    }
    .chunk-btn:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.18);
    }

    .chunk-btn:active {
      transform: scale(0.94);
    }

    .chunk-btn.copied {
      border-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.12);
    }

    .chunk-btn.active-preview {
      box-shadow: 0 0 0 2px var(--accent-cyan);
    }

    .chunk-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .chunk-btn.copied .chunk-num {
      color: var(--accent-green);
    }

    .chunk-lines {
      font-size: 0.68rem;
      color: #facc15;
      font-weight: 700;
    }
    .chunk-chars {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .chunk-status {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      display: none;
    }

    .chunk-btn.copied .chunk-status {
      display: block;
    }

    .preview-box {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      max-height: 130px;
      overflow: auto;
      white-space: pre;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent-green);
      color: #04130d;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 20px;
      border-radius: 99px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>

<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-dot"></div>
        <h1>CodeSplitter Pro</h1>
      </div>
      <span class="badge" id="statsBadge">0 lignes</span>
    </header>

    <section class="card">
      <div class="editor-header">
        <span>Code source (#BLOC respectés)</span>
        <div class="editor-actions">
          <button type="button" class="btn-mini" id="btnPaste">Coller</button>
          <button type="button" class="btn-mini" id="btnClear">Effacer</button>
        </div>
      </div>
      <textarea id="codeInput" placeholder="Collez votre code monolithique ici..."></textarea>

      <div class="controls-row">
        <div class="stepper">
          <button type="button" id="btnMinus">−</button>
          <input type="number" id="partsCount" value="3" min="1" max="50">
          <button type="button" id="btnPlus">+</button>
        </div>
        <div class="presets">
          <button type="button" class="preset-btn" data-val="2">2</button>
          <button type="button" class="preset-btn active" data-val="3">3</button>
          <button type="button" class="preset-btn" data-val="4">4</button>
          <button type="button" class="preset-btn" data-val="6">6</button>
        </div>
      </div>

      <button type="button" class="btn-split" id="btnSplit">DÉCOUPER EN ÉQUILIBRANT</button>
    </section>

    <section class="card" id="resultsCard" style="display: none;">
      <div class="results-header">
        <span id="resultsInfo">Parties générées</span>
        <span id="copiedCounter">0 / 0 copiés</span>
      </div>
<input
  type="search"
  id="chunkSearch"
  class="chunk-search"
  placeholder="⌕ Rechercher un mot dans les découpes..."
  autocomplete="off"
  spellcheck="false"
>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="grid-chunks" id="chunksGrid"></div>
      <button type="button" class="btn-copy-next" id="btnCopyNext">Copier la partie suivante (#1)</button>
      <div class="preview-box" id="previewBox">Touchez un carré pour copier et prévisualiser...</div>
      <div class="integrity-panel" id="integrityPanel">
        <span class="integrity-title">Contrôle d’intégrité</span>
        <span>Le contrôle sera effectué après le découpage.</span>
      </div>
    </section>
  </div>

  <div class="toast" id="toast">Copié dans le presse-papier !</div>

  <script>
    const state = {
      chunks: [],
      copiedSet: new Set(),
      activeIndex: -1
    };

    const dom = {
      codeInput: document.getElementById('codeInput'),
      statsBadge: document.getElementById('statsBadge'),
      partsCount: document.getElementById('partsCount'),
      btnMinus: document.getElementById('btnMinus'),
      btnPlus: document.getElementById('btnPlus'),
      btnPaste: document.getElementById('btnPaste'),
      btnClear: document.getElementById('btnClear'),
      btnSplit: document.getElementById('btnSplit'),
      resultsCard: document.getElementById('resultsCard'),
      resultsInfo: document.getElementById('resultsInfo'),
      copiedCounter: document.getElementById('copiedCounter'),
      progressFill: document.getElementById('progressFill'),
      btnCopyNext: document.getElementById('btnCopyNext'),
      chunksGrid: document.getElementById('chunksGrid'),
      previewBox: document.getElementById('previewBox'),
      toast: document.getElementById('toast'),
      presets: document.querySelectorAll('.preset-btn'),
      chunkSearch: document.getElementById('chunkSearch'),
      searchInfo: document.getElementById('searchInfo'),
      integrityPanel: document.getElementById('integrityPanel')
    };

    // Analyse un segment de lignes en unités de premier niveau (blocs entiers ou lignes libres)
    function parseTopLevelUnits(lines) {
      const units = [];
      const stack = [];
      let buffer = [];

      const openRegex = /(?:\/\*|<!--)\s*#BLOC:([^\s*>-]+)\s*(?:\*\/|-->)/;
      const closeRegex = /(?:\/\*|<!--)\s*#FIN:([^\s*>-]+)\s*(?:\*\/|-->)/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const openMatch = line.match(openRegex);
        const closeMatch = line.match(closeRegex);

        if (openMatch) {
          if (stack.length === 0 && buffer.length > 0) {
            units.push({ lines: buffer, weight: buffer.length, isBlock: false });
            buffer = [];
          }
          stack.push(openMatch[1]);
          buffer.push(line);
        } else if (closeMatch) {
          buffer.push(line);
          if (stack.length > 0) {
            stack.pop();
          }
          if (stack.length === 0) {
            units.push({ lines: buffer, weight: buffer.length, isBlock: true });
            buffer = [];
          }
        } else {
          if (stack.length === 0) {
            units.push({ lines: [line], weight: 1, isBlock: false });
          } else {
            buffer.push(line);
          }
        }
      }

      if (buffer.length > 0) {
        units.push({ lines: buffer, weight: buffer.length, isBlock: stack.length > 0 });
      }

      return units;
    }

    // Si un bloc parent est trop grand pour une partie, descend d'un niveau pour utiliser ses sous-blocs
    function expandOversizedBlocks(lines, maxAllowedWeight) {
      const topUnits = parseTopLevelUnits(lines);
      const result = [];

      for (const unit of topUnits) {
        if (unit.isBlock && unit.weight > maxAllowedWeight && unit.lines.length > 2) {
          const headerLine = unit.lines[0];
          const footerLine = unit.lines[unit.lines.length - 1];
          const innerLines = unit.lines.slice(1, -1);

          // Vérifie s'il y a des sous-blocs à l'intérieur
          const innerUnits = parseTopLevelUnits(innerLines);
          const hasSubBlocks = innerUnits.some(u => u.isBlock);

          if (hasSubBlocks) {
            // Rattache le marqueur d'ouverture au premier sous-élément et fermeture au dernier
            innerUnits[0].lines.unshift(headerLine);
            innerUnits[0].weight += 1;

            const lastIdx = innerUnits.length - 1;
            innerUnits[lastIdx].lines.push(footerLine);
            innerUnits[lastIdx].weight += 1;

            // Descente récursive si un sous-bloc est encore trop grand
            for (const sub of innerUnits) {
              if (sub.isBlock && sub.weight > maxAllowedWeight) {
                result.push(...expandOversizedBlocks(sub.lines, maxAllowedWeight));
              } else {
                result.push(sub);
              }
            }
          } else {
            // Aucun sous-bloc : on garde le bloc atomique intact pour ne jamais le tronquer
            result.push(unit);
          }
        } else {
          result.push(unit);
        }
      }

      return result;
    }

    function partitionBalancedUnits(lines, targetParts) {
      const totalLines = lines.length;
      if (totalLines === 0) return [];

      const idealSize = Math.ceil(totalLines / Math.max(1, targetParts));
      // Seuil : un bloc parent n'est ouvert en sous-blocs que s'il dépasse 1.15x la taille idéale d'une part
      const units = expandOversizedBlocks(lines, idealSize * 1.15);

      const n = units.length;
      const k = Math.min(Math.max(1, targetParts), n);

      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        prefix[i + 1] = prefix[i] + units[i].weight;
      }

      const totalWeight = prefix[n];
      const ideal = totalWeight / k;

      const dp = Array.from({ length: k + 1 }, () => new Array(n + 1).fill(Infinity));
      const parent = Array.from({ length: k + 1 }, () => new Array(n + 1).fill(0));

      dp[0][0] = 0;

      for (let p = 1; p <= k; p++) {
        for (let i = p; i <= n; i++) {
          for (let j = p - 1; j < i; j++) {
            const segWeight = prefix[i] - prefix[j];
            const diff = segWeight - ideal;
            // Légère pénalité supplémentaire si la coupe tombe entre deux lignes sans saut ni bloc
            const boundaryPenalty = (!units[j]?.isBlock && units[j]?.lines[0]?.trim() !== '') ? 0.5 : 0;
            const cost = dp[p - 1][j] + (diff * diff) + boundaryPenalty;
            if (cost < dp[p][i]) {
              dp[p][i] = cost;
              parent[p][i] = j;
            }
          }
        }
      }

      const slices = [];
      let curr = n;
      for (let p = k; p >= 1; p--) {
        const prev = parent[p][curr];
        slices.unshift([prev, curr]);
        curr = prev;
      }

      return slices.map(([start, end]) => {
        const mergedLines = [];
        for (let u = start; u < end; u++) {
          mergedLines.push(...units[u].lines);
        }
        const text = mergedLines.join('\n');
        return {
          text,
          lineCount: mergedLines.length,
          charCount: text.length
        };
      });
    }

    function splitCode() {
      const raw = dom.codeInput.value;

      if (!raw.trim()) {
        showToast('Collez du code avant de découper');
        return;
      }

      const validation = validateBlockMarkers(raw);

      if (!validation.valid) {
        state.integrity = {
          valid: false,
          exactMatch: false,
          errors: validation.errors,
          totalLines: raw.split(/\r?\n/).length
        };

        dom.resultsCard.style.display = 'flex';
        renderIntegrityReport();
        showToast('Découpage bloqué : marqueurs incomplets');
        return;
      }

      const lines = raw.split(/\r?\n/);
      const requestedParts = parseInt(dom.partsCount.value, 10) || 1;

      state.chunks = partitionBalancedUnits(lines, requestedParts);
      state.copiedSet.clear();
      state.activeIndex = -1;

      state.integrity = runIntegrityCheck(raw);

      renderChunks();
    }

    function renderChunks() {
      dom.resultsCard.style.display = 'flex';
      dom.chunksGrid.innerHTML = '';

      const total = state.chunks.length;
      dom.resultsInfo.textContent = `${total} partie${total > 1 ? 's' : ''} (aucun bloc tronqué)`;
      updateCopiedCounter();

      state.chunks.forEach((chunk, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chunk-btn';

        btn.innerHTML = `
          <span class="chunk-status"></span>
          <span class="chunk-num">#${index + 1}</span>
          <span class="chunk-lines">${chunk.lineCount} lig.</span>
          <span class="chunk-chars">${chunk.charCount} car.</span>
        `;

        btn.addEventListener('click', () => handleChunkClick(index, btn));
        dom.chunksGrid.appendChild(btn);
      });

      dom.previewBox.textContent = 'Touchez un carré pour copier et prévisualiser...';

      applyChunkSearch();
      renderIntegrityReport();
    }
function updateChunkSearch() {
  const searchInput = document.getElementById('chunkSearch');
  if (!searchInput) return;

  const query = searchInput.value
    .trim()
    .toLocaleLowerCase('fr')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');

  const terms = query.split(/\s+/).filter(Boolean);

  document.querySelectorAll('.chunk-btn').forEach((btn, index) => {
    const chunk = state.chunks[index];
    if (!chunk) return;

    const content = chunk.text
      .toLocaleLowerCase('fr')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');

    const matches = terms.length === 0 ||
      terms.every(term => content.includes(term));

    btn.classList.toggle('search-match', matches && terms.length > 0);
    btn.classList.toggle('search-dimmed', !matches);
  });
}

    async function handleChunkClick(index, btnElement) {
      const chunk = state.chunks[index];
      if (!chunk) return;

      try {
        await navigator.clipboard.writeText(chunk.text);
      } catch {
        const temp = document.createElement('textarea');
        temp.value = chunk.text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      }

      if (navigator.vibrate) {
        navigator.vibrate(25);
      }

      state.copiedSet.add(index);
      state.activeIndex = index;

      document.querySelectorAll('.chunk-btn').forEach((el, idx) => {
        el.classList.toggle('active-preview', idx === index);
      });
      const btn = btnElement || (dom.chunksGrid && dom.chunksGrid.children[index]);
      if (btn) btn.classList.add('copied');

      updateCopiedCounter();
      dom.previewBox.textContent = chunk.text;
      showToast(`Partie #${index + 1} copiée (${chunk.lineCount} lignes, ${chunk.charCount} car.)`);
    }
    function copyNextChunk() {
      if (!state.chunks || state.chunks.length === 0) return;
      let target = state.chunks.findIndex((_, idx) => !state.copiedSet.has(idx));
      if (target === -1) target = 0;
      handleChunkClick(target, dom.chunksGrid.children[target]);
    }

    function updateStats() {
      const val = dom.codeInput.value;
      const lines = val ? val.split(/\r?\n/).length : 0;
      const chars = val ? val.length : 0;
      dom.statsBadge.textContent = `${lines} lig. · ${chars.toLocaleString('fr-FR')} car.`;
    }
    // Vérifie que chaque marqueur #BLOC possède son #FIN correspondant.
    function validateBlockMarkers(source) {
      const lines = source.split(/\r?\n/);
      const stack = [];
      const errors = [];

      const markerRegex = /(?:\/\*|<!--)\s*#(BLOC|FIN):([^\s*>-]+)\s*(?:\*\/|-->)/g;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        markerRegex.lastIndex = 0;

        let match;

        while ((match = markerRegex.exec(line)) !== null) {
          const type = match[1];
          const name = match[2];

          if (type === 'BLOC') {
            stack.push({
              name,
              line: i + 1
            });
            continue;
          }

          if (stack.length === 0) {
            errors.push(`Ligne ${i + 1} : #FIN:${name} sans ouverture correspondante.`);
            continue;
          }

          const opened = stack.pop();

          if (opened.name !== name) {
            errors.push(
              `Ligne ${i + 1} : #FIN:${name} ne correspond pas à #BLOC:${opened.name} (ligne ${opened.line}).`
            );
          }
        }
      }

      stack.reverse().forEach(opened => {
        errors.push(
          `Ligne ${opened.line} : #BLOC:${opened.name} n'a pas de marqueur #FIN correspondant.`
        );
      });

      return {
        valid: errors.length === 0,
        errors
      };
    }
    // Vérifie que toutes les lignes du code source sont présentes dans les parties.
    function runIntegrityCheck(source) {
      const normalizedSource = source.replace(/\r\n/g, '\n');
      const reconstructed = state.chunks.map(chunk => chunk.text).join('\n');
      const totalLines = normalizedSource.split('\n').length;
      const outputLines = state.chunks.reduce(
        (total, chunk) => total + chunk.lineCount,
        0
      );

      const blockCount = (source.match(
        /(?:\/\*|<!--)\s*#BLOC:/g
      ) || []).length;

      const exactMatch = reconstructed === normalizedSource;

      return {
        valid: exactMatch && totalLines === outputLines,
        exactMatch,
        totalLines,
        outputLines,
        blockCount,
        totalChunks: state.chunks.length,
        totalChars: source.length,
        errors: exactMatch
          ? []
          : ['Le contenu reconstitué diffère du code source.']
      };
    }
    function renderIntegrityReport() {
      if (!dom.integrityPanel || !state.integrity) return;

      const report = state.integrity;
      dom.integrityPanel.className = `integrity-panel ${report.valid ? 'ok' : 'error'}`;

      const details = [
        `<span class="integrity-title">${report.valid ? '✓ Intégrité vérifiée' : '⚠ Problème détecté'}</span>`
      ];

      if (report.totalLines !== undefined) {
        details.push(`Lignes source : ${report.totalLines}`);
      }

      if (report.outputLines !== undefined) {
        details.push(`Lignes réparties : ${report.outputLines}`);
      }

      if (report.totalChunks !== undefined) {
        details.push(`Parties générées : ${report.totalChunks}`);
      }

      if (report.blockCount !== undefined) {
        details.push(`Blocs détectés : ${report.blockCount}`);
      }

      if (report.totalChars !== undefined) {
        details.push(`Caractères source : ${report.totalChars.toLocaleString('fr-FR')}`);
      }

      if (report.exactMatch !== undefined) {
        details.push(
          report.exactMatch
            ? 'Contenu : aucune perte ni modification détectée.'
            : 'Contenu : différence détectée entre la source et les parties.'
        );
      }

      if (report.errors && report.errors.length) {
        report.errors.forEach(error => {
          details.push(`• ${error}`);
        });
      }

      dom.integrityPanel.replaceChildren();

      details.forEach(detail => {
        const line = document.createElement('span');
        line.textContent = detail.replace(/<[^>]*>/g, '');
        if (detail.includes('integrity-title')) {
          line.className = 'integrity-title';
        }
        dom.integrityPanel.appendChild(line);
      });
    }
    function applyChunkSearch() {
      if (!dom.chunkSearch || !dom.chunksGrid || !dom.searchInfo) return;

      const query = dom.chunkSearch.value.trim().toLocaleLowerCase('fr-FR');
      const buttons = Array.from(dom.chunksGrid.children);

      if (!query) {
        buttons.forEach(btn => {
          btn.classList.remove('search-match', 'search-dim');
        });

        dom.searchInfo.textContent = state.chunks.length
          ? `${state.chunks.length} parties disponibles`
          : '';

        return;
      }

      let matches = 0;

      state.chunks.forEach((chunk, index) => {
        const btn = buttons[index];
        if (!btn) return;

        const found = chunk.text.toLocaleLowerCase('fr-FR').includes(query);

        btn.classList.toggle('search-match', found);
        btn.classList.toggle('search-dim', !found);

        if (found) matches++;
      });

      dom.searchInfo.textContent =
        `${matches} résultat${matches > 1 ? 's' : ''} sur ${state.chunks.length} partie${state.chunks.length > 1 ? 's' : ''}`;
    }
    const LOCAL_DRAFT_KEY = 'codesplitter_pro_local_draft';

    function saveLocalDraft() {
      try {
        const value = dom.codeInput.value;

        if (value) {
          localStorage.setItem(LOCAL_DRAFT_KEY, value);
        } else {
          localStorage.removeItem(LOCAL_DRAFT_KEY);
        }
      } catch (error) {
        console.warn('Sauvegarde locale impossible :', error);
      }
    }
    function restoreLocalDraft() {
      try {
        const saved = localStorage.getItem(LOCAL_DRAFT_KEY);

        if (saved !== null && !dom.codeInput.value) {
          dom.codeInput.value = saved;
          updateStats();
          showToast('Brouillon local restauré');
        }
      } catch (error) {
        console.warn('Restauration locale impossible :', error);
      }
    }

    function updateCopiedCounter() {
      const total = state.chunks.length;
      const copied = state.copiedSet.size;
      const allDone = total > 0 && copied === total;

      dom.copiedCounter.textContent = allDone ? `${total} / ${total} copiés ✓` : `${copied} / ${total} copiés`;

      if (dom.progressFill) {
        const pct = total > 0 ? (copied / total) * 100 : 0;
        dom.progressFill.style.width = `${pct}%`;
      }

      if (dom.btnCopyNext) {
        if (allDone) {
          dom.btnCopyNext.textContent = '✓ Toutes les parties sont copiées';
          dom.btnCopyNext.classList.add('all-done');
        } else {
          const nextIndex = state.chunks.findIndex((_, idx) => !state.copiedSet.has(idx));
          const target = nextIndex !== -1 ? nextIndex : 0;
          dom.btnCopyNext.textContent = `Copier la partie suivante (#${target + 1})`;
          dom.btnCopyNext.classList.remove('all-done');
        }
      }
    }

    function syncPresets(val) {
      dom.presets.forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.val, 10) === val);
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      dom.toast.textContent = msg;
      dom.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        dom.toast.classList.remove('show');
      }, 1800);
    }

    function initEvents() {
      dom.codeInput.addEventListener('input', updateStats);
      dom.codeInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          splitCode();
        }
      });
      dom.codeInput.addEventListener('input', saveLocalDraft);
const chunkSearch = document.getElementById('chunkSearch');
if (chunkSearch) {
  chunkSearch.addEventListener('input', updateChunkSearch);
}

      dom.btnMinus.addEventListener('click', () => {
        const val = Math.max(1, (parseInt(dom.partsCount.value, 10) || 1) - 1);
        dom.partsCount.value = val;
        syncPresets(val);
      });

      dom.btnPlus.addEventListener('click', () => {
        const val = Math.min(50, (parseInt(dom.partsCount.value, 10) || 1) + 1);
        dom.partsCount.value = val;
        syncPresets(val);
      });

      dom.partsCount.addEventListener('input', () => {
        const val = parseInt(dom.partsCount.value, 10) || 1;
        syncPresets(val);
      });

      dom.presets.forEach(btn => {
        btn.addEventListener('click', () => {
          const val = parseInt(btn.dataset.val, 10);
          dom.partsCount.value = val;
          syncPresets(val);
        });
      });

      dom.btnPaste.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          dom.codeInput.value = text;
          updateStats();
          showToast('Code collé depuis le presse-papier');
        } catch {
          showToast('Autorisez l’accès au presse-papier ou collez manuellement');
        }
      });

      dom.btnClear.addEventListener('click', () => {
        dom.codeInput.value = '';
        updateStats();
        dom.resultsCard.style.display = 'none';
      });
      dom.btnClear.addEventListener('click', () => {
        try {
          localStorage.removeItem(LOCAL_DRAFT_KEY);
        } catch (error) {
          console.warn('Suppression du brouillon impossible :', error);
        }
      });

      dom.btnSplit.addEventListener('click', splitCode);
      if (dom.btnCopyNext) {
        dom.btnCopyNext.addEventListener('click', copyNextChunk);
      }
    }

    initEvents();
    restoreLocalDraft();
  </script>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));
});
}
</script>
</body>
